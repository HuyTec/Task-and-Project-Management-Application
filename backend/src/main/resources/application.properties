# Use the local profile by default. Production should set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL - defaults match docker-compose.yml for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanagement_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Bound client-controlled pagination to protect memory and database load.
spring.data.web.pageable.max-page-size=${MAX_PAGE_SIZE:100}

# Flyway is the only component allowed to change the database schema.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Keep this false by default. Enable it only once for a verified legacy database.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# JWT values use milliseconds. Secrets come from environment or ignored local config.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Custom refresh-token cookie
app.cookie.secure=${APP_COOKIE_SECURE:false}

# Google Identity Services uses a public Web client ID. No client secret is required
# for server-side ID-token verification.
app.google.client-id=${GOOGLE_CLIENT_ID:634975163301-3cm1bkn9gjgppefojd43chi70dm7up6n.apps.googleusercontent.com}

# Initial administrator
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD}
